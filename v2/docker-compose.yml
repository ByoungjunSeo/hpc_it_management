services:
  db:
    image: postgres:16-alpine
    container_name: it-assets-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_assets}
      POSTGRES_USER: ${POSTGRES_USER:-itadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    networks:
      - it-assets-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itadmin} -d ${POSTGRES_DB:-it_assets}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  it-assets-net:
    driver: bridge
