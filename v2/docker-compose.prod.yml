# IT 자산관리 v2 — 배포용 스택 (B-5b)
# 사용: docker compose -f docker-compose.prod.yml up -d
# (개발용 docker-compose.yml과 독립 — 개발 스택은 무수정 보존)
#
# 사전 준비: cp .env.example .env 후 CHANGE_ME 값 전부 채우기.
# 이미지는 사내망 tar 전달(앱+DB 둘 다): it-assets-2.0.1.tar.gz + postgres-16-alpine.tar.gz
#   gunzip -c it-assets-2.0.1.tar.gz | docker load
#   gunzip -c postgres-16-alpine.tar.gz | docker load

name: it-assets

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-it_assets}
      POSTGRES_USER: ${POSTGRES_USER:-itadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      # named volume: 윈도우 Docker Desktop 호환(퍼미션/성능) — bind mount 대신 사용
      - pgdata:/var/lib/postgresql/data
      # 최초 기동 시 스키마 자동 생성 (db/*.sql)
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itadmin} -d ${POSTGRES_DB:-it_assets}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - it-assets-net
    # DB 포트는 호스트에 노출하지 않음 (앱 컨테이너에서만 접근)

  app:
    # 배포용: tar로 load한 이미지를 그대로 사용(빌드 안 함).
    # 이미지 빌드는 인터넷/사내미러 있는 환경에서 별도 수행:
    #   docker build -t it-assets:2.0.1 .   (Dockerfile은 배포 tar에 미포함)
    image: ${APP_IMAGE:-it-assets:2.0.1}
    restart: always
    env_file: .env
    environment:
      # 컨테이너 내부 고정값 (env_file 값을 덮어씀)
      PGHOST: db
      PGPORT: 5432
      APP_PORT: 3001
      NODE_ENV: production
    ports:
      # 호스트 공개 포트는 .env의 APP_PORT (기본 3001)
      - "${APP_PORT:-3001}:3001"
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - it-assets-net

volumes:
  pgdata:
  uploads:

networks:
  it-assets-net:
    driver: bridge
